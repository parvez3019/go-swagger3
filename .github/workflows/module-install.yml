name: Module install check

# Verifies that a released version can be installed by an outside user from
# the public module proxy. Guards against adapters depending on an unreleased
# or replace-only version of the root module.
on:
  push:
    tags:
      - "v*"
      - "swagger/*/v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to check (e.g. v1.2.1). Defaults to latest."
        required: false
        default: "latest"

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        adapter: [atreugo, buffalo, chi, echo, fiber, flamingo, gin, hertz, mux]
    steps:
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          check-latest: true

      - name: Resolve version
        id: ver
        run: |
          ref="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            v="${{ inputs.version }}"
          else
            # v1.2.1 or swagger/gin/v1.2.1 -> v1.2.1
            v="${ref##*/}"
          fi
          echo "version=${v:-latest}" >> "$GITHUB_OUTPUT"

      - name: Install from proxy in a fresh module
        env:
          GOFLAGS: -mod=mod
          GOWORK: "off"
          ADAPTER: github.com/parvez3019/go-swagger3/swagger/${{ matrix.adapter }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          dir="$(mktemp -d)"
          cd "$dir"
          go mod init example.com/installcheck
          # The proxy can lag a fresh tag by a minute or two; retry briefly.
          for i in 1 2 3 4 5 6; do
            if go get "${ADAPTER}@${VERSION}"; then break; fi
            [ "$i" = 6 ] && exit 1
            sleep 20
          done
          cat > main.go <<EOF
          package main

          import _ "${ADAPTER}"

          func main() {}
          EOF
          go build ./...
          go list -m github.com/parvez3019/go-swagger3 "${ADAPTER}"

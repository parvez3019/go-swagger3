name: Docker Build and Publish

on:
  push:
    tags:
      # Root module releases only (v1.2.1). Adapter tags like swagger/gin/v1.2.1
      # contain a slash and are not matched.
      - "v*"
  # Manual (re)build of an existing release tag, e.g. when the tag push did not
  # trigger the workflow.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build (e.g. v1.2.1)"
        required: true

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKER_USERNAME }}/go-swagger3
          flavor: latest=true
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build and tag Docker image
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.RELEASE_TAG }}

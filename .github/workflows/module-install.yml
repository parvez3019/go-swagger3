name: Module install check

# Verifies that released versions can be installed by an outside user from
# the public module proxy. Guards against adapters depending on an unreleased
# or replace-only version of the root module.
#
# - Root tag (v1.2.2): `go install` the CLI at that tag, and `go get` every
#   adapter at @latest against it.
# - Adapter tag (swagger/gin/v1.2.2): `go get` that adapter at its tag.
on:
  push:
    tags:
      - "v*"
      - "swagger/*/v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Adapter version to check (e.g. v1.2.1). Defaults to latest."
        required: false
        default: "latest"

permissions:
  contents: read

env:
  GOFLAGS: -mod=mod
  GOWORK: "off"

jobs:
  cli:
    if: github.event_name == 'push' && !startsWith(github.ref_name, 'swagger/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          check-latest: true
      - name: go install the CLI at the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for i in 1 2 3 4 5 6; do
            if go install "github.com/parvez3019/go-swagger3@${TAG}"; then break; fi
            [ "$i" = 6 ] && exit 1
            sleep 20
          done
          "$(go env GOPATH)/bin/go-swagger3" --version

  adapters:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        adapter: [atreugo, buffalo, chi, echo, fiber, flamingo, gin, hertz, mux]
    steps:
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          check-latest: true

      - name: Resolve version
        id: ver
        env:
          REF: ${{ github.ref_name }}
          ADAPTER: ${{ matrix.adapter }}
        run: |
          skip=false
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            v="${{ inputs.version }}"
          elif [ "${REF#swagger/}" != "${REF}" ]; then
            # Adapter tag: only check the tagged adapter, at its version.
            case "${REF}" in
              "swagger/${ADAPTER}/"*) v="${REF##*/}" ;;
              *) skip=true ;;
            esac
          else
            # Root tag: adapters keep their own versions; check @latest.
            v=latest
          fi
          echo "version=${v:-latest}" >> "$GITHUB_OUTPUT"
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"

      - name: Install from proxy in a fresh module
        if: steps.ver.outputs.skip != 'true'
        env:
          ADAPTER: github.com/parvez3019/go-swagger3/swagger/${{ matrix.adapter }}
          VERSION: ${{ steps.ver.outputs.version }}
          ROOT_TAG: ${{ (github.event_name == 'push' && !startsWith(github.ref_name, 'swagger/')) && github.ref_name || '' }}
        run: |
          dir="$(mktemp -d)"
          cd "$dir"
          go mod init example.com/installcheck
          # The proxy can lag a fresh tag by a minute or two; retry briefly.
          for i in 1 2 3 4 5 6; do
            if go get "${ADAPTER}@${VERSION}" ${ROOT_TAG:+github.com/parvez3019/go-swagger3@${ROOT_TAG}}; then break; fi
            [ "$i" = 6 ] && exit 1
            sleep 20
          done
          cat > main.go <<EOF
          package main

          import _ "${ADAPTER}"

          func main() {}
          EOF
          go build ./...
          go list -m github.com/parvez3019/go-swagger3 "${ADAPTER}"

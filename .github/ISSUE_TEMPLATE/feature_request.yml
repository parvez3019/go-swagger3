name: Feature request
description: A new annotation, OpenAPI feature, framework adapter or CLI option
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you express or do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed annotation or behaviour
      description: Show the Go comment/struct tag you'd write and the OpenAPI it should produce.
    validations:
      required: true
  - type: input
    id: swag
    attributes:
      label: swag equivalent (if any)
      description: If swaggo/swag supports this, which annotation?
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd like to implement this myself

name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          check-latest: true

      - name: Build and Test
        run: |
          go mod tidy
          go build
          # -coverpkg counts code exercised by integration_test across all
          # packages (matches `make cover`); generated mocks are excluded.
          go test -v -coverpkg=./... -coverprofile=coverage.out.tmp -covermode=atomic ./...
          grep -v "mocks/" coverage.out.tmp > coverage.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Each framework adapter and example is its own Go module. Test them in the
  # go.work workspace (against the working tree) and standalone with
  # GOWORK=off (against the released root module, the way users consume them).
  modules:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - swagger/atreugo
          - swagger/buffalo
          - swagger/chi
          - swagger/echo
          - swagger/fiber
          - swagger/flamingo
          - swagger/gin
          - swagger/hertz
          - swagger/mux
          - examples/chi
          - examples/echo
          - examples/gin
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          check-latest: true

      - name: Test in workspace
        run: |
          go vet ./...
          go test ./...

      - name: Test standalone (GOWORK=off)
        env:
          GOWORK: "off"
        run: |
          go mod tidy -diff
          go build ./...
          go test ./...
